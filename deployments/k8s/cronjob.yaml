apiVersion: batch/v1
kind: CronJob
metadata:
  name: integration-havochvatten
  labels:
    app: integration-havochvatten
spec:
  schedule: "0 6 * * *"  # Run daily at 06:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app: integration-havochvatten
        spec:
          restartPolicy: OnFailure
          containers:
            - name: integration-havochvatten
              image: integration-havochvatten:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: NUTS_CODES
                  valueFrom:
                    configMapKeyRef:
                      name: integration-havochvatten-config
                      key: NUTS_CODES
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "128Mi"
                  cpu: "100m"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: integration-havochvatten-config
  labels:
    app: integration-havochvatten
data:
  NUTS_CODES: "SE110,SE121,SE122"
